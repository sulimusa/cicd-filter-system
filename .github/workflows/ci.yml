name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests
        run: python -m pytest --junitxml=reports/junit.xml
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel outside source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/filter-smoke"
          "$RUNNER_TEMP/filter-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/filter-smoke/bin/cicd-filter" \
            --config "$GITHUB_WORKSPACE/examples/filters.yaml" \
            --output "$GITHUB_WORKSPACE/reports/filters.env" \
            App.kt src/test/FiltersTest.kt README.md
          diff -u "$GITHUB_WORKSPACE/examples/expected.env.txt" \
            "$GITHUB_WORKSPACE/reports/filters.env"
      - name: Upload test and package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-python-${{ matrix.python-version }}
          path: |
            reports/
            dist/
          if-no-files-found: error
          retention-days: 14
