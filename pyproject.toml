[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-filter-system"
version = "0.1.0"
description = "Evaluate changed file paths against named CI filters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7"] 

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
cicd-filter = "cicd_filter.cli:main"